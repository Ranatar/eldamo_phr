<title>Neo-Roots Graph</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif:ital,wght@0,500;0,600;1,400;1,500&display=swap">
<style>
/* Layout: one-screen tool — a sidebar (search, card, legend) beside the graph; roots at the left, words to the right. */
:root {
  --bg: #eef1f4;
  --panel: #fbfcfd;
  --ink: #18212c;
  --muted: #5a6676;
  --line: #d3d9e1;
  --accent: #2c5a86;
  --focus: #18212c;

  --n-root: #a8780a;
  --n-root-soft: #a8780a66;
  --n-nq: #13738a;
  --n-ns: #3a8343;
  --n-np: #6a55b0;
  --n-form: #8893a2;

  --e-deriv: #3b679c;
  --e-element: #b9503f;
  --e-combine: #74852f;
  --e-see: #8893a2;
  --e-deprecated: #b98320;
  --e-cognate: #a8458a;
  --e-merged: #a8780a;
  --e-filed: #a8780a;
  --e-rootderiv: #a8780a;
  --e-instead: #9a7f5a;
  --l-elvish: #b0612a;

  --warn: #a5541d;
  --ok: #2f7a45;

  --f-form: "Noto Serif", "DejaVu Serif", Georgia, serif;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", Consolas, "DejaVu Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161d; --panel: #171e27; --ink: #e3e8ef; --muted: #96a2b2; --line: #2a3441; --accent: #8db8e4; --focus: #f1f4f8;
    --n-root: #e2b34a; --n-root-soft: #e2b34a66; --n-nq: #49b6cc; --n-ns: #6dc07a; --n-np: #a593ea; --n-form: #7f8b9b;
    --e-deriv: #7ba7dc; --e-element: #e88371; --e-combine: #aabd5c; --e-see: #7f8b9b; --e-deprecated: #e2ad4c;
    --e-cognate: #dc7fc0; --e-merged: #e2b34a; --e-filed: #e2b34a; --e-rootderiv: #e2b34a; --e-instead: #b9a17c; --l-elvish: #e39a5f;
    --warn: #ea9157; --ok: #6dc07a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161d; --panel: #171e27; --ink: #e3e8ef; --muted: #96a2b2; --line: #2a3441; --accent: #8db8e4; --focus: #f1f4f8;
  --n-root: #e2b34a; --n-root-soft: #e2b34a66; --n-nq: #49b6cc; --n-ns: #6dc07a; --n-np: #a593ea; --n-form: #7f8b9b;
  --e-deriv: #7ba7dc; --e-element: #e88371; --e-combine: #aabd5c; --e-see: #7f8b9b; --e-deprecated: #e2ad4c;
  --e-cognate: #dc7fc0; --e-merged: #e2b34a; --e-filed: #e2b34a; --e-rootderiv: #e2b34a; --e-instead: #b9a17c; --l-elvish: #e39a5f;
  --warn: #ea9157; --ok: #6dc07a;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 14px; line-height: 1.45;
  overflow: hidden;
}
.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(300px, 360px) 1fr;
}
.side {
  min-width: 0;
  display: flex; flex-direction: column; gap: 14px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: 16px;
  background: var(--panel);
  border-right: 1px solid var(--line);
  overflow-y: auto;
}
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.btn.lang { flex: none; font-size: 12px; padding: 3px 8px; }
.head-tools { display: flex; gap: 4px; flex: none; }
.brand h1 { margin: 0; font-family: var(--f-form); font-weight: 600; font-size: 20px; letter-spacing: .01em; text-wrap: balance; }
.brand .stat { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.search { display: flex; flex-direction: column; gap: 6px; position: relative; }
.search-row { display: flex; gap: 6px; }
input[type="search"], select {
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0;
}
input[type="search"] { flex: 1; }
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
.results {
  display: flex; flex-direction: column;
  border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
  max-height: 46vh; overflow-y: auto;
}
.results button {
  all: unset; cursor: pointer; display: block; padding: 6px 9px;
  border-bottom: 1px solid var(--line);
}
.results button:last-child { border-bottom: 0; }
.results button:hover, .results button:focus-visible { background: var(--bg); }
.results .none { padding: 8px 9px; color: var(--muted); }

.mk { color: var(--muted); font-family: var(--f-form); font-size: .92em; }
.fm { font-family: var(--f-form); font-style: italic; font-weight: 500; }
.root-fm { font-style: normal; font-weight: 600; }
.gl { color: var(--muted); }

.card { display: flex; flex-direction: column; gap: 10px; }
.card-head { display: flex; flex-direction: column; gap: 2px; }
.card-head .big { font-family: var(--f-form); font-size: 24px; line-height: 1.2; overflow-wrap: anywhere; }
.card .meta { color: var(--muted); font-size: 12.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.ok { color: var(--ok); border-color: currentColor; }
.tag.warn { color: var(--warn); border-color: currentColor; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn {
  font: inherit; font-size: 12.5px; cursor: pointer;
  color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
a.ext { color: var(--accent); font-size: 12.5px; }
.sec h3 {
  margin: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.links li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; }
.links .rel { font-size: 11.5px; padding: 0 6px; border-radius: 4px; border: 1px solid currentColor; }
.links button { all: unset; cursor: pointer; }
.links button:hover .fm, .links button:focus-visible .fm { text-decoration: underline; }
.written { flex-basis: 100%; padding-left: 12px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.more { color: var(--muted); font-size: 12px; }

.legend { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
.legend label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; }
.legend svg { flex: none; overflow: visible; }
.hint { color: var(--muted); font-size: 12px; }

.stage { position: relative; min-width: 0; min-height: 0; }
#graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#graph:active { cursor: grabbing; }
/* the origins map is drawn on a canvas over the svg (which takes the pointer) */
#ov-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#graph.ov-hover { cursor: pointer; }
.ov-tip {
  position: absolute; z-index: 5; max-width: 320px; padding: 6px 9px; border-radius: 6px; pointer-events: none;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 2px 8px rgb(0 0 0 / .12);
  font-size: 12.5px; white-space: pre-line;
}
.stage-bar {
  position: absolute; top: 12px; left: 12px; right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px;
  pointer-events: none;
}
.stage-bar > * { pointer-events: auto; }
.stage-tools { display: flex; gap: 6px; }
.seg { display: flex; }
.seg .btn { border-radius: 0; }
.seg .btn:first-child { border-radius: 6px 0 0 6px; }
.seg .btn:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
.seg .btn[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.stage-left { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
.ov-tools {
  width: 250px; max-width: 100%;
  display: flex; flex-direction: column; gap: 5px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  font-size: 12.5px;
}
.ov-tools label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.ov-head { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.ov-cat > circle { fill: none; stroke: var(--line); stroke-dasharray: 3 3; }
.ov-cat > text { fill: var(--muted); font-family: var(--f-ui); font-weight: 600; text-anchor: middle; }
.ov-hint { margin: 2px 0 0; color: var(--muted); font-size: 11.5px; }
.ov-group circle { fill: var(--line); fill-opacity: .25; stroke: var(--line); }
.ov-group text { fill: var(--muted); font-family: var(--f-form); font-weight: 600; opacity: .55; }
.ov-leaf { cursor: pointer; }
.ov-leaf text { font-family: var(--f-form); font-weight: 600; fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.ov-leaf.sel circle { stroke: var(--focus); stroke-width: 2.2; }
.stage-note {
  position: absolute; left: 12px; bottom: max(10px, env(safe-area-inset-bottom, 0px));
  color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px;
}

.node text { font-family: var(--f-form); font-size: 12.5px; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
.node text .lm { font-size: 11px; }
.node text .more { fill: var(--accent); font-family: var(--f-ui); font-size: 10.5px; }
.node { cursor: pointer; }
.node.sel .ring { stroke: var(--focus); }
.node.dep { opacity: .55; }
.node.pinned .shape { stroke-width: 2.6px; }
.edge.via { opacity: .7; }
.links button.dep { opacity: .7; }
.switches label { display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px; cursor: pointer; margin-bottom: 4px; }
.switches input { margin-top: 3px; }
.switches .par-mode { flex-direction: column; align-items: stretch; gap: 4px; cursor: default; }
.band rect { fill: var(--line); fill-opacity: .22; }
.band text { fill: var(--muted); font-family: var(--f-ui); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.langs { display: flex; flex-direction: column; gap: 8px; }
.lang-group { display: flex; flex-direction: column; gap: 2px; }
.lang-group > label { font-weight: 600; }
.lang-items { display: flex; flex-direction: column; gap: 1px; padding-left: 18px; }
.langs label { display: flex; align-items: baseline; gap: 5px; font-size: 12.5px; cursor: pointer; }
.langs .cnt { margin-left: auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.edge { fill: none; stroke-width: 1.5; }
.edge.nm { opacity: .45; }
.edge.sc { stroke-dasharray: 2 4; stroke-width: 1.1; opacity: .7; }
.legend .sc-toggle { align-items: flex-start; margin-top: 8px; color: var(--muted); }
.legend .sc-toggle input { margin-top: 3px; }

@media (max-width: 760px) {
  html, body { height: auto; }
  body { overflow: auto; }
  .app {
    display: flex; flex-direction: column; gap: 14px; height: auto;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--panel);
  }
  .side { display: contents; }
  .brand { order: 1; }
  .search { order: 2; }
  .stage { order: 3; height: 70svh; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); overflow: hidden; }
  .card { order: 4; }
  .ov-hint { display: none; }
  .legend { order: 5; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-row">
        <h1 data-i18n="page.h1">Корни нео-эльдарина</h1>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
(function () {
'use strict';
const G = JSON.parse(document.getElementById('graph-data').textContent);
const N = G.nodes.length;
const SITE = 'https://eldamo.org/content/words/word-';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------- interface language
// The catalog (graph_messages.json, embedded by make_graph.py) maps a key to {ru, en};
// placeholders are {name}. Eldamo's data (forms, glosses) are not translated. The choice
// is kept in the browser; without one, the browser's language decides. A switch redraws
// the page in place, so the open graph stays.
const MESSAGES = JSON.parse(document.getElementById('messages-data').textContent);
const LANG_KEY = 'neo-roots-lang';
let uiLang = (() => {
  try { const v = localStorage.getItem(LANG_KEY); if (v === 'ru' || v === 'en') return v; } catch (e) { /* storage unavailable */ }
  const nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'ru';
  return /^(ru|uk|be|kk)\b/i.test(nav) ? 'ru' : 'en';
})();
function t(key, params) {
  const e = MESSAGES[key];
  if (!e) { console.warn('i18n: no message', key); return key; }
  const text = e[uiLang] != null ? e[uiLang] : e.ru;
  return params ? text.replace(/\{(\w+)\}/g, (m, k) => (params[k] != null ? String(params[k]) : m)) : text;
}
const has = key => Object.prototype.hasOwnProperty.call(MESSAGES, key);
function translateStatic() {
  document.documentElement.lang = uiLang;
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll('[data-i18n-attr]')) {
    for (const pair of el.dataset.i18nAttr.split(';')) {
      const [attr, key] = pair.split(':');
      if (attr && key) el.setAttribute(attr.trim(), t(key.trim()));
    }
  }
}
const num = n => n.toLocaleString(uiLang === 'ru' ? 'ru-RU' : 'en-GB');

// ---------------------------------------------------------------- vocabulary
const LANG = {
  q: ['Q.', 'Quenya'], mq: ['ᴹQ.', 'Middle Quenya'], eq: ['ᴱQ.', 'Early Quenya'], nq: ['ᴺQ.', 'Neo-Quenya'],
  s: ['S.', 'Sindarin'], n: ['N.', 'Noldorin'], en: ['ᴱN.', 'Early Noldorin'], g: ['G.', 'Gnomish'], ns: ['ᴺS.', 'Neo-Sindarin'],
  on: ['ON.', 'Old Noldorin'], os: ['OS.', 'Old Sindarin'], t: ['T.', 'Telerin'], mt: ['ᴹT.', 'Middle Telerin'], et: ['ᴱT.', 'Early Telerin'],

  });

  const bary = (d, nb) => mean((nb.get(d) || []).filter(x => x.ty != null).map(x => x.ty));
  const branchKey = d => BRANCH_RANK[branchOf(G.nodes[d.i].l)];
  const eraKey = d => -eraOf(G.nodes[d.i].l);
  const nameKey = d => String(shown(d.i));
  const baryKey = d => (d._b == null ? 1e9 : d._b);
  const ORDERS = {
    // derivatives of one source together; among them Quenya above Sindarin. Sources a few pixels
    // apart count as one place (a word from two neighbouring forms)
    source: (p, q) => (Math.round(baryKey(p) / 4) - Math.round(baryKey(q) / 4)) || (branchKey(p) - branchKey(q))
      || (eraKey(p) - eraKey(q)) || (baryKey(p) - baryKey(q)) || nameKey(p).localeCompare(nameKey(q)),
    branch: (p, q) => (branchKey(p) - branchKey(q)) || (eraKey(p) - eraKey(q)) || (baryKey(p) - baryKey(q))
      || nameKey(p).localeCompare(nameKey(q)),
    alpha: (p, q) => nameKey(p).localeCompare(nameKey(q)) || (branchKey(p) - branchKey(q)),
  };
  // a column in its order, each node as near its sources (or derivatives) as the others let it:
  // down from the top without overlaps, then back up so that the column fits its band
  function place(key, sortIt, nb) {
    const col = cols.get(key), b = +key.split(':')[0];
    for (const d of col) d._b = bary(d, nb);
    if (sortIt) col.sort(ORDERS[colOrder]);
    if (!col.some(d => d._b != null) && col[0].ty != null) return;     // nothing to align to: stays
    const [lo, hi] = bandRange.get(b);
    const n = col.length, ys = new Array(n);
    // where a node without neighbours wants to be: right under the previous one
    let prev = -Infinity;
    for (let k = 0; k < n; k++) {
      const d = col[k];
      const want = d._b != null ? d._b : (k ? prev : (lo + hi) / 2 - span(col) / 2);
      ys[k] = Math.max(want, k ? ys[k - 1] + slot(col[k - 1]) : lo, lo);
      prev = ys[k] + slot(d);
    }
    let bottom = hi;
    for (let k = n - 1; k >= 0; k--) {
      ys[k] = Math.min(ys[k], bottom - (slot(col[k]) - unit));
      bottom = ys[k] - unit;
    }
    for (let k = 0; k < n; k++) { col[k].ty = ys[k]; col[k].tx = col[k].rank * COL; }
  }
  for (const k of keys) place(k, true, parents);                 // left to right, by parents
  for (const k of [...keys].reverse()) place(k, false, children); // right to left, by children
  for (const k of keys) place(k, colOrder !== 'branch' && colOrder !== 'alpha', parents);  // by parents again
  for (const d of data) {
    if (!d.anchor) continue;
    d.tx = d.anchor.tx; d.ty = d.anchor.ty + d.stack * STACK; d.band = d.anchor.band;
  }
  return bands;
}

let fitPending = false;
let lastCounts = null;
function showNote() {
  if (mode === 'roots') $('note').textContent = t('ov.note', { r: ovCounts.roots, p: ovCounts.proto, w: ovCounts.words });
  else if (lastCounts) $('note').textContent = t('note.onScreen', { nodes: lastCounts[0], edges: lastCounts[1] });
}
function render(refit) {
  const shownSet = new Set([...visible].filter(i => i === focusNode || passes(i)));

  const rank = ranks(nodes, edges, groupOf);
  COL = svg.node().getBoundingClientRect().width < 700 ? 160 : 230;
  const data = nodes.map(i => {
    let p = pos.get(i);
    const fresh = !p;
    if (!p) { p = {}; pos.set(i, p); }
    p.i = i; p.rank = rank.get(groupOf.get(i)); p.stack = stackIdx.get(i); p.fresh = fresh;
    return p;
  });
  const byI = new Map(data.map(d => [d.i, d]));

  }));

  // edges

    enter => enter.append('path').attr('class', 'edge').call(p => p.append('title')));
  es.attr('stroke', d => css('--e-' + d.rel))
    .attr('stroke-dasharray', d => (d.via ? '1 4' : DASH[d.rel]))
    .attr('stroke-width', d => d.rel === 'element' && !d.via ? 2 : 1.5)
    .classed('nm', d => !!(d.x && d.x.nm))
    .classed('sc', d => !!(d.x && d.x.sc))
    .classed('via', d => !!d.via)
    .attr('marker-end', d => `url(#arrow-${d.rel})`);
  es.select('title').text(d => {
    let tip = `${REL[d.rel][1]}: ${marker(d.a)} ${shown(d.a)} → ${marker(d.b)} ${shown(d.b)}`;
    if (d.via) tip += '\n' + t('edge.via');
    if (d.x && d.x.nm) tip += '\n' + t('edge.nm');
    if (d.x && d.x.sc) tip += '\n' + t('edge.sc');
    for (const [src, chain] of (d.x && d.x.w) || []) tip += '\n' + t('card.written', { src, chain: chain.join(' > ') });
    return tip;

  // nodes
  const ns = gNodes.selectAll('g.node').data(data, d => d.i).join(enter => {
    const g = enter.append('g').attr('class', 'node');

    g.append('path').attr('class', 'shape');
    g.append('text').attr('text-anchor', 'middle').attr('y', -11);
    g.append('title');
    g.on('click', (ev, d) => { ev.stopPropagation(); select(d.i); clicks(d.i, ev.detail); })
      .call(d3.drag()
        // a node is dragged with what hangs on it alone (its derivatives without another parent on
        // the graph); with Shift alone. What is moved stays where it is put; "Re-layout" frees it
        .on('start', (ev, d) => {

        .on('drag', (ev, d) => { for (const m of d._group) { m.fx = ev.x + m._dx; m.fy = clampY(m, ev.y + m._dy); } })

    .classed('dep', d => G.nodes[d.i].x === 'd')

    .attr('fill', d => shapeFill(d.i)).attr('stroke', d => nodeColor(d.i))
    .attr('stroke-width', 1.6).attr('stroke-dasharray', d => (G.nodes[d.i].k === 'root' && !G.nodes[d.i].rec ? '2 2' : null));

  ns.select('text').each(function (d) {
    const label = d3.select(this);

    if (al) label.append('tspan').attr('class', 'lm').style('fill', langColor(al, isR)).text('[' + codeMarker(al, isR) + ']');
    label.append('tspan').attr('font-style', isR ? 'normal' : 'italic')
      .attr('font-weight', isR ? 600 : 500).text((isR ? '' : ' ') + shown(d.i));
    const h = hiddenCount(d.i);
    if (h) label.append('tspan').attr('class', 'more').text('  +' + h);

  ns.select('title').text(d => `${marker(d.i)} ${shown(d.i)}${G.nodes[d.i].g ? ' “' + G.nodes[d.i].g + '”' : ''}`);

    .force('y', d3.forceY(d => d.ty).strength(0.5))

  if (refit && !reduced) setTimeout(() => { if (fitPending) { fitView(true); fitPending = false; } }, 1100);

  // the bands behind the graph
  const bandSel = gBands.selectAll('g.band').data(parMode === 'bands' ? bands : [], x => x.b).join(enter => {
    const g = enter.append('g').attr('class', 'band');

      let x0 = Infinity, x1 = -Infinity;
      for (const d of data) { if (d.x - d.w / 2 < x0) x0 = d.x - d.w / 2; if (d.x + d.w / 2 > x1) x1 = d.x + d.w / 2; }
      bandSel.select('rect').attr('x', x0 - 40).attr('width', x1 - x0 + 80)
        .attr('y', x => x.y0).attr('height', x => x.y1 - x.y0);
      bandSel.select('text').attr('x', x0 - 36).attr('y', x => x.y0 - 8);      // above its band
    }
  }
  lastCounts = [data.length, links.length];
  showNote();
}

function shapePath(i) {
  const n = G.nodes[i];
  if (n.k === 'root') return d3.symbol(d3.symbolDiamond, 150)();
  if (n.k === 'form') return d3.symbol(d3.symbolCircle, 70)();
  return d3.symbol(d3.symbolCircle, 120)();
}
function shapeFill(i) {
  const n = G.nodes[i];
  if (n.k === 'root') return n.rec ? css('--n-root') : css('--bg');
  if (n.k === 'protoform' || n.x === 'm') return css('--bg');     // a merged form: hollow
  return nodeColor(i);
}

function fitView(animate) {
  if (mode !== 'graph') return;
  const items = [...shownNodes].map(i => pos.get(i)).filter(Boolean);
  if (!items.length) return;
  const box = svg.node().getBoundingClientRect();
  const xs = items.map(p => p.x), ys = items.map(p => p.y);
  // room for the band labels on top, and for the buttons over the graph
  const x0 = Math.min(...xs) - 90, x1 = Math.max(...xs) + 90, y0 = Math.min(...ys) - (parMode === 'bands' ? 70 : 40), y1 = Math.max(...ys) + 24;
  const top = 52, h = box.height - top;
  const k = Math.min(1.6, 0.92 * Math.min(box.width / (x1 - x0), h / (y1 - y0)));
  const tr = d3.zoomIdentity.translate(box.width / 2 - k * (x0 + x1) / 2, top + h / 2 - k * (y0 + y1) / 2).scale(k);
  (animate ? svg.transition().duration(450) : svg).call(zoom.transform, tr);
}

$('card').addEventListener('click', ev => {

// ---------------------------------------------------------------- search
const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[¹²³⁴⁵⁶⁷⁸⁹⁰√✶*!^#†()\-]/g, '').toLowerCase()
  .replace(/qu/g, 'q').replace(/c/g, 'k').replace(/ks/g, 'x');
let keys = null;
function searchKeys() {
  if (!keys) keys = G.nodes.map(n => [fold(n.f), fold(n.sp), (n.g || '').toLowerCase()]);
  return keys;
}
function search() {
  const raw = $('q').value.trim();
  const box = $('results');
  if (!raw) { box.hidden = true; return; }
  const q = fold(raw), ql = raw.toLowerCase(), scope = $('scope').value;
  const K = searchKeys();
  const hits = [];
  for (let i = 0; i < N; i++) {
    const n = G.nodes[i];
    if (scope === 'root' ? n.k !== 'root' : scope ? n.grp !== scope : !(n.grp || n.k === 'root')) continue;
    if (n.x === 'd' && !showDeprecated) continue;          // deprecated words with their switch on
    const [f, sp, g] = K[i];
    let s = -1;
    if (q && (f === q || sp === q)) s = 0;
    else if (q && (f.startsWith(q) || sp.startsWith(q))) s = 1;
    else if (g && g.replace(/[*?()\[\]"“”]/g, '').trim() === ql) s = 1.5;
    else if (g && g.split(/[^\p{L}]+/u).includes(ql)) s = 2;
    else if (q && f.includes(q)) s = 3;
    else if (g && g.includes(ql)) s = 4;
    if (s >= 0) hits.push([s, n.k === 'root' ? 1 : n.x ? 2 : 0, f.length, i]);
  }
  hits.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
  box.innerHTML = hits.slice(0, 40).map(([, , , i]) => {
    const n = G.nodes[i];
    const tag = n.x === 'd' ? ` <span class="tag warn">⚠ ${esc(t('tag.deprecatedWord'))}</span>` : n.x === 'm' ? ` <span class="tag">${esc(t('tag.mergedForm'))}</span>` : '';
    return `<button type="button" data-hit="${i}">${markerHtml(i)}${n.k === 'root' ? '' : ' '}<span class="${n.k === 'root' ? 'fm root-fm' : 'fm'}">${esc(shown(i))}</span>`
      + `${n.g ? ` <span class="gl">“${esc(n.g)}”</span>` : ''}${tag}</button>`;
  }).join('') || `<div class="none">${esc(t('search.none'))}</div>`;
  box.hidden = false;
}
$('q').addEventListener('input', search);
$('scope').addEventListener('change', search);
$('results').addEventListener('click', ev => {
  const b = ev.target.closest('[data-hit]');
  if (!b) return;
  $('results').hidden = true;
  focus(+b.dataset.hit);
});
$('q').addEventListener('keydown', ev => {
  if (ev.key === 'Enter') { const b = $('results').querySelector('[data-hit]'); if (b) { $('results').hidden = true; focus(+b.dataset.hit); } }
  if (ev.key === 'Escape') $('results').hidden = true;
});

let ovBuilt = false;
const initial = i => {
  const f = String(G.nodes[i].f || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\p{L}]/gu, '');
  return (f[0] || '?').toUpperCase();
};
function ovValue(i) {
  const n = G.nodes[i];
  return n.k === 'root' ? (n.dc || 0) : (n.ds || 0);
}
const PRIM = new Set(['p', 'mp', 'ep', 'np']);
function ovCategory(i) {
  const n = G.nodes[i];
  if (n.k === 'root') return ('rec' in n) && !n.nl ? 'roots' : null;
  if (!n.nr || n.x === 'm') return null;                 // a merged form stands with its word
  if (n.x === 'd' && !showDeprecated) return null;
  return PRIM.has(n.l) ? 'proto' : 'words';
}
function ovFill(i) {
  const n = G.nodes[i];
  if (n.k === 'root') return n.rec ? css('--n-root') : css('--bg');
  if (n.grp) return css('--n-' + n.grp);
  return css('--bg');
}
function ovStroke(i) {
  const n = G.nodes[i];
  if (n.k === 'root') return css('--n-root');
  if (n.grp) return css('--n-' + n.grp);
  return PRIM.has(n.l) ? css('--n-np') : css('--n-form');
}
function buildOverview() {
  const show = { roots: $('ov-roots').checked, proto: $('ov-proto').checked, words: $('ov-words').checked };
  $('ov-rec').disabled = !show.roots;      // a filter of roots
  const onlyRec = $('ov-rec').checked, onlyFree = $('ov-free').checked;
  const items = [];
  const counts = { roots: 0, proto: 0, words: 0 };
  for (let i = 0; i < N; i++) {
    const cat = ovCategory(i);
    if (!cat || !show[cat]) continue;
    const n = G.nodes[i];
    if (langOn[n.l] === false) continue;      // the languages of the legend (√, ᴹ√, ᴱ√, ᴺ√ for roots)
    if (cat === 'roots' && onlyRec && !n.rec) continue;
    if (onlyFree && ovValue(i)) continue;
    items.push([cat, i]);
    counts[cat]++;
  }
  const cats = ['roots', 'proto', 'words'].filter(c => counts[c]);
  const tree = {
    children: cats.map(c => ({
      cat: c,
      children: [...d3.group(items.filter(x => x[0] === c).map(x => x[1]), initial)]
        .sort((a, b) => a[0].localeCompare(b[0]))
        .map(([key, v]) => ({ key, children: v.map(i => ({ i })) })),
    })),
  };
  const h = d3.hierarchy(tree).sum(d => (d.i != null ? 1 + ovValue(d.i) : 0)).sort((a, b) => b.value - a.value);
  d3.pack().size([1000, 1000]).padding(d => (d.depth === 0 ? 18 : d.depth === 1 ? 10 : 1.2))(h);
  ovCats = (h.children || []).length > 1 ? h.children : [];
  ovLetters = (h.children || []).flatMap(c => c.children || []);
  ovLeaves = h.leaves().filter(d => d.data.i != null);
  ovBuilt = true;
  ovCounts = counts;

  ovRequestDraw();
}
let ovCounts = { roots: 0, proto: 0, words: 0 };
// The map is drawn on a canvas: thousands of svg circles and labels made every step of the zoom
// lay out the text anew (most of the time of a frame); a canvas redraws only what is on screen
const ovCanvas = $('ov-canvas'), ovTip = $('ov-tip');
let ovCats = [], ovLetters = [], ovLeaves = [], ovFrame = 0;
function ovRequestDraw() {
  if (!ovFrame) ovFrame = requestAnimationFrame(() => { ovFrame = 0; ovDraw(); });
}
function ovDraw() {
  if (mode !== 'roots') return;
  const w = ovCanvas.clientWidth, h = ovCanvas.clientHeight, dpr = window.devicePixelRatio || 1;
  if (ovCanvas.width !== Math.round(w * dpr) || ovCanvas.height !== Math.round(h * dpr)) {
    ovCanvas.width = Math.round(w * dpr); ovCanvas.height = Math.round(h * dpr);
  }
  const ctx = ovCanvas.getContext('2d');
  const tr = d3.zoomTransform(svg.node()), k = tr.k;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, ovCanvas.width, ovCanvas.height);
  // what is on screen, in map units
  const vx0 = -tr.x / k, vy0 = -tr.y / k, vx1 = (w - tr.x) / k, vy1 = (h - tr.y) / k;
  const seen = d => d.x + d.r > vx0 && d.x - d.r < vx1 && d.y + d.r > vy0 && d.y - d.r < vy1;
  const C = { line: css('--line'), muted: css('--muted'), ink: css('--ink'), bg: css('--bg'), focus: css('--focus') };
  const fForm = css('--f-form'), fUi = css('--f-ui');
  ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * tr.x, dpr * tr.y);
  const circle = d => { ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 2 * Math.PI); };
  // categories: a dashed ring
  ctx.lineWidth = 1 / k; ctx.strokeStyle = C.line; ctx.setLineDash([3 / k, 3 / k]);
  for (const d of ovCats) { if (!seen(d)) continue; ctx.beginPath(); ctx.arc(d.x, d.y, d.r + 4, 0, 2 * Math.PI); ctx.stroke(); }
  ctx.setLineDash([]);
  // letters: a faint disc
  for (const d of ovLetters) {
    if (!seen(d)) continue;
    circle(d);
    ctx.globalAlpha = .25; ctx.fillStyle = C.line; ctx.fill();
    ctx.globalAlpha = 1; ctx.strokeStyle = C.line; ctx.stroke();
  }
  // leaves
  const fills = new Map();
  const fillOf = i => { let f = fills.get(i); if (f === undefined) { f = ovFill(i); fills.set(i, f); } return f; };
  const strokes = new Map();
  ctx.lineWidth = 0.6;
  for (const d of ovLeaves) {
    if (!seen(d)) continue;
    const i = d.data.i, n = G.nodes[i], f = fillOf(i);
    circle(d);
    ctx.globalAlpha = f === C.bg ? 1 : 0.85; ctx.fillStyle = f; ctx.fill(); ctx.globalAlpha = 1;
    let st = strokes.get(n.grp || n.k + n.l);
    if (st === undefined) { st = ovStroke(i); strokes.set(n.grp || n.k + n.l, st); }
    ctx.strokeStyle = st;
    if (n.k === 'root' && !n.rec) ctx.setLineDash([1.5, 1]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  const sel = ovLeaves.find(d => d.data.i === selected);
  if (sel) { circle(sel); ctx.lineWidth = 2.2; ctx.strokeStyle = C.focus; ctx.stroke(); }
  // the labels in screen pixels, so that small text stays sharp at any zoom
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.textAlign = 'center';
  const at = (x, y) => [tr.x + x * k, tr.y + y * k];
  ctx.fillStyle = C.muted; ctx.textBaseline = 'alphabetic';
  for (const d of ovCats) {
    if (!seen(d)) continue;
    const [x, y] = at(d.x, d.y - d.r - 8);
    ctx.font = `600 ${Math.max(9, Math.min(d.r * 0.12, 22)) * k}px ${fUi}`;
    ctx.fillText(t('ov.show.' + d.data.cat), x, y);
  }
  ctx.globalAlpha = .55;
  for (const d of ovLetters) {
    if (!seen(d)) continue;
    const size = Math.min(d.r * 0.3, 26) * k;
    if (size < 4) continue;
    const [x, y] = at(d.x, d.y - d.r + Math.min(d.r * 0.35, 30));
    ctx.font = `600 ${size}px ${fForm}`;
    ctx.fillText(d.data.key, x, y);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.ink; ctx.textBaseline = 'middle';
  for (const d of ovLeaves) {
    if (d.r * k < 9 || !seen(d)) continue;      // a label once its circle can hold it
    const [x, y] = at(d.x, d.y);
    ctx.font = `600 ${Math.max(1.2, Math.min(d.r * 0.42, 14)) * k}px ${fForm}`;
    ctx.fillText(ovLabel(d.data.i), x, y);

}
const ovLabel = i => marker(i) + (G.nodes[i].k === 'root' ? '' : ' ') + shown(i);
// the leaf under the pointer: the innermost circle that holds it
function ovHit(ev) {
  const [px, py] = d3.pointer(ev, svg.node());
  const tr = d3.zoomTransform(svg.node());
  const [x, y] = tr.invert([px, py]);

}
svg.on('click.ov', ev => {
  if (mode !== 'roots' || ev.defaultPrevented) return;
  const d = ovHit(ev);
  if (d) select(d.data.i);
}).on('dblclick.ov', ev => {
  if (mode !== 'roots') return;
  const d = ovHit(ev);
  if (d) focus(d.data.i);
}).on('mousemove.ov', ev => {
  if (mode !== 'roots') return;
  const d = ev.buttons ? null : ovHit(ev);
  svg.classed('ov-hover', !!d);
  if (!d) { ovTip.hidden = true; return; }
  const i = d.data.i, n = G.nodes[i], v = ovValue(i);
  ovTip.textContent = `${marker(i)} ${shown(i)}${n.g ? ' “' + n.g + '”' : ''}${v ? '\n' + t('tag.noRootDerivatives', { n: v }) : ''}`;
  const box = ovCanvas.getBoundingClientRect();
  ovTip.hidden = false;
  const tw = ovTip.offsetWidth, th = ovTip.offsetHeight;

  if (m === mode) return;

  root.attr('display', m === 'graph' ? null : 'none');
  ovCanvas.hidden = m !== 'roots';
  ovTip.hidden = true;
  $('mode-graph').setAttribute('aria-pressed', String(m === 'graph'));
  $('mode-roots').setAttribute('aria-pressed', String(m === 'roots'));
  $('ov-tools').hidden = m !== 'roots';

  } else {

$('mode-graph').addEventListener('click', () => setMode('graph'));
$('mode-roots').addEventListener('click', () => setMode('roots'));
for (const id of ['ov-roots', 'ov-proto', 'ov-words', 'ov-rec', 'ov-free']) $(id).addEventListener('change', () => { buildOverview(); ovFit(!reduced); });

// ---------------------------------------------------------------- legend
function legend() {
  const nodeItems = [
    [t('legend.n.nq'), d3.symbol(d3.symbolCircle, 120)(), css('--n-nq'), css('--n-nq'), null],
    [t('legend.n.ns'), d3.symbol(d3.symbolCircle, 120)(), css('--n-ns'), css('--n-ns'), null],
    [t('legend.n.np'), d3.symbol(d3.symbolCircle, 120)(), css('--n-np'), css('--n-np'), null],
    [t('legend.n.proto'), d3.symbol(d3.symbolCircle, 120)(), css('--bg'), css('--n-np'), null],
    [t('legend.n.form'), d3.symbol(d3.symbolCircle, 70)(), css('--n-form'), css('--n-form'), null],
    [t('legend.n.root'), d3.symbol(d3.symbolDiamond, 150)(), css('--n-root'), css('--n-root'), null],
    [t('legend.n.rootWarn'), d3.symbol(d3.symbolDiamond, 150)(), css('--bg'), css('--n-root'), '2 2'],
    [t('legend.n.merged'), d3.symbol(d3.symbolCircle, 120)(), css('--bg'), css('--n-nq'), null],

    `<label><svg width="16" height="16" viewBox="-8 -8 16 16" aria-hidden="true"><path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="1.6"${dash ? ` stroke-dasharray="${dash}"` : ''}${op ? ` opacity="${op}"` : ''}/></svg>${esc(label)}</label>`).join('');

    `<label title="${esc(REL[r][1])}"><input type="checkbox" id="rel-${r}" data-rel="${r}"${relOn[r] ? ' checked' : ''}>`
    + `<svg width="26" height="10" viewBox="0 0 26 10" aria-hidden="true"><line x1="1" y1="5" x2="25" y2="5" stroke="${css('--e-' + r)}" stroke-width="${r === 'element' ? 2 : 1.6}"${DASH[r] ? ` stroke-dasharray="${DASH[r]}"` : ''}/></svg>${esc(REL[r][0])}</label>`).join('');

// languages present on the graph, by branch, from neo to early; the marker in its colour
const LANG_COUNT = new Map();
for (const n of G.nodes) LANG_COUNT.set(n.l, (LANG_COUNT.get(n.l) || 0) + 1);
const BRANCH_ORDER = ['quenya', 'sindarin', 'primitive', 'elvish', 'other'];
function legendLangs() {
  const groups = new Map(BRANCH_ORDER.map(b => [b, []]));
  for (const code of LANG_COUNT.keys()) groups.get(branchOf(code)).push(code);
  $('legend-langs').innerHTML = BRANCH_ORDER.filter(b => groups.get(b).length).map(b => {
    const codes = groups.get(b).sort((x, y) => eraOf(y) - eraOf(x) || x.localeCompare(y));
    const all = codes.every(c => langOn[c] !== false);
    return `<div class="lang-group"><label><input type="checkbox" data-branch="${b}"${all ? ' checked' : ''}> ${esc(t('branch.' + b))}</label>`
      + `<div class="lang-items">${codes.map(c => `<label title="${esc(langName(c))}"><input type="checkbox" data-lang="${c}"${langOn[c] !== false ? ' checked' : ''}>`
      + `<span class="mk" style="color:${langColor(c, false)}">${esc(codeMarker(c, false))}</span>`
      + `<span>${esc(langName(c))}</span> <span class="cnt">${num(LANG_COUNT.get(c))}</span></label>`).join('')}</div></div>`;

}
function refilter() {
  render(false);
  if (selected >= 0) select(selected);
  if (ovBuilt) buildOverview();
  if (!$('results').hidden) search();
}
$('legend-langs').addEventListener('change', ev => {
  const c = ev.target;
  if (c.dataset.lang) langOn[c.dataset.lang] = c.checked;
  if (c.dataset.branch) for (const code of LANG_COUNT.keys()) if (branchOf(code) === c.dataset.branch) langOn[code] = c.checked;

$('show-dep').addEventListener('change', ev => { showDeprecated = ev.target.checked; refilter(); });
$('col-order').value = colOrder;
$('col-order').addEventListener('change', ev => {
  colOrder = ev.target.value;
  try { localStorage.setItem('neo-roots-order', colOrder); } catch (e) { /* storage unavailable */ }
  for (const i of visible) pos.delete(i);
  render(true);
  if (selected >= 0) select(selected);
});
$('par-mode').addEventListener('change', ev => {
  parMode = ev.target.value;
  for (const i of visible) pos.delete(i);          // a new arrangement, laid out afresh
  render(true);
  if (selected >= 0) select(selected);
});

$('legend-edges').addEventListener('change', ev => {
  const c = ev.target.closest('[data-rel]');
  if (!c) return;
  relOn[c.dataset.rel] = c.checked;
  render(false);
  if (selected >= 0) select(selected);
});

$('shortcuts').addEventListener('change', ev => {
  showShortcuts = ev.target.checked;
  if (showShortcuts && focusNode >= 0) for (const x of upstream(focusNode, 300)) { visible.add(x); own(x, 'core'); }
  render(false);
  if (selected >= 0) select(selected);
});

// theme changes recolor the drawing
function recolor() {
  colorCache.clear();
  makeMarkers(); legend(); legendLangs();
  if (visible.size) render(false); if (selected >= 0) select(selected); if (ovBuilt) buildOverview();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', recolor);
new MutationObserver(recolor).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---------------------------------------------------------------- start
const words = G.nodes.filter(isListed).length;
const depWords = G.nodes.filter(n => n.x === 'd').length;
const rootsCount = G.nodes.filter(n => n.k === 'root').length;
function showStat() {
  $('stat').textContent = t('page.stat', { v: G.version, words: num(words), dep: num(depWords), roots: num(rootsCount), edges: num(G.edges.length) });
}
function applyLanguage() {
  translateStatic();
  applyTheme();
  showStat();
  showNote();
  legend();
  legendLangs();
  if (selected >= 0) select(selected);
  if (!$('results').hidden) search();
  if (visible.size) render(false);
  if (ovBuilt) buildOverview();

// the theme: the system's (or the host's) by default, or chosen here: auto -> light -> dark;
// the choice is kept in this browser and set as data-theme, which the colour tokens follow
const THEME_KEY = 'neo-roots-theme';

$('theme-toggle').addEventListener('click', () => {

$('lang-toggle').addEventListener('click', () => {
  uiLang = uiLang === 'ru' ? 'en' : 'ru';
  try { localStorage.setItem(LANG_KEY, uiLang); } catch (e) { /* storage unavailable */ }
  applyLanguage();

translateStatic();
applyTheme();
showStat();
makeMarkers();

legendLangs();
function fromHash() {
  const m = /^#n-(\w+)$/.exec(location.hash);
  return m && indexOf.has(m[1]) ? indexOf.get(m[1]) : -1;
}
window.addEventListener('hashchange', () => {
  if (location.hash === '#all-roots') { setMode('roots'); return; }
  const i = fromHash(); if (i >= 0 && i !== focusNode) focus(i);
});
const wantRoots = location.hash === '#all-roots';
const start = fromHash();
focus(start >= 0 ? start : indexOf.get('539805327'));     // Q. alda
if (wantRoots) setMode('roots');
})();
